version: '3.8'

services:
  # 1. El cerebro: Motor de Inteligencia Artificial
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Guarda el modelo pesadísimo para no descargarlo cada vez
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:3b && wait" ]

  # 2. El puente: Tu API (FastAPI)
  backend:
    build: 
      context: .
      dockerfile: ./learning-agent/Dockerfile
    ports:
      - "8006:8006"
    environment:
      # Aquí le decimos que Ollama vive en la red de Docker, no en localhost
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/serviceAccountKey.json 
    volumes:
      # Inyecta tu llave de Firebase sin guardarla en el contenedor
      - ./learning-agent/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      - ollama

  # 3. La cara: Tu Web React
  frontend:
    build:
      context: ./frontend-version
    ports:
      # Expone la web en el puerto 5173
      - "5173:80" 
    depends_on:
      - backend

volumes:
  ollama_data: